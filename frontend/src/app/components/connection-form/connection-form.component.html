<!-- frontend/src/app/components/connection-form/connection-form.component.html -->
<mat-card>
  <mat-card-header>
    <mat-card-title>Connect to Oracle</mat-card-title>
    <mat-card-subtitle>Enter your read-only credentials</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="connectForm" (ngSubmit)="onSubmit()" class="connect-form">
      <div class="form-row">
        <mat-form-field appearance="fill">
          <mat-label>Host</mat-label>
          <input matInput formControlName="host">
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Port</mat-label>
          <input matInput type="number" formControlName="port">
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="fill">
          <mat-label>Service Name</mat-label>
          <input matInput formControlName="serviceName">
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>SID</mat-label>
          <input matInput formControlName="sid">
        </mat-form-field>
      </div>
      <div *ngIf="connectForm.hasError('requiredOneOf') && (connectForm.touched || connectForm.dirty)" class="error-message">
        Either Service Name or SID is required.
      </div>

      <div class="form-row">
        <mat-form-field appearance="fill">
          <mat-label>Username</mat-label>
          <input matInput formControlName="user">
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
        </mat-form-field>
      </div>
      
      <div class="form-row">
        <mat-slide-toggle formControlName="ssl">Use SSL/TCPS</mat-slide-toggle>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>
    </form>
  </mat-card-content>
  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="isLoading || connectForm.invalid">
      <span *ngIf="!isLoading">Connect</span>
      <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
    </button>
  </mat-card-actions>
</mat-card>
