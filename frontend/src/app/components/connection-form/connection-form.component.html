<!-- frontend/src/app/components/connection-form/connection-form.component.html -->
<mat-card>
  <mat-card-header>
    <mat-card-title>Connect to Oracle</mat-card-title>
    <mat-card-subtitle>Select a backend-managed database profile</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="connectForm" (ngSubmit)="onSubmit()" class="connect-form">
      <mat-form-field appearance="outline">
        <mat-label>Database Profile</mat-label>
        <mat-select formControlName="profileAlias" [disabled]="isProfilesLoading">
          <mat-option *ngFor="let profile of profiles" [value]="profile.alias">
            {{ profile.label || profile.alias }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>
    </form>
  </mat-card-content>
  <mat-card-actions align="end">
    <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="isLoading || isProfilesLoading || connectForm.invalid">
      <span *ngIf="!isLoading">Connect</span>
      <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
    </button>
  </mat-card-actions>
</mat-card>
