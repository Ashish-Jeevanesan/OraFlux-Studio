<!-- frontend/src/app/app.component.html -->
<mat-toolbar color="primary" class="main-toolbar">
  <img src="assets/logo.svg" alt="OraFlux Studio Logo" class="toolbar-logo">
  <span>OraFlux Studio</span>
  <span class="toolbar-spacer"></span>
  <a mat-icon-button href="https://github.com/Ashish-Jeevanesan/OraFlux-Studio" target="_blank" aria-label="GitHub Repository">
    <mat-icon svgIcon="github-logo"></mat-icon>
  </a>
</mat-toolbar>

<main class="content">
  <div *ngIf="!isConnected; else mainApp" class="main-app-container">
    <app-connection-form (connectionSuccess)="onConnectionSuccess()"></app-connection-form>
  </div>

  <ng-template #mainApp>
    <div *ngIf="!showSummaryReport; else summaryReport">
      <div class="main-app-container">
        <app-sql-runner 
          (querySuccess)="onQuerySuccess($event)"
          (generateReport)="onGenerateReport()">
        </app-sql-runner>
        
        <app-chart-suggestions 
          [columns]="lastQueryColumns" 
          (suggestionClick)="onSuggestionClicked($event)">
        </app-chart-suggestions>

        <app-report-builder 
          [baseSql]="lastSuccessfulSql" 
          [columns]="lastQueryColumns"
          [suggestion]="activeSuggestion">
        </app-report-builder>
      </div>
    </div>
    <ng-template #summaryReport>
      <div class="main-app-container">
        <app-summary-report 
          [baseSql]="lastSuccessfulSql"
          (back)="onBackToQuery()">
        </app-summary-report>
      </div>
    </ng-template>
  </ng-template>
</main>
