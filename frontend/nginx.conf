# frontend/nginx.conf
server {
  listen 80;
  server_name localhost;

  # Root directory for the Angular app
  root /usr/share/nginx/html;
  index index.html index.htm;

  location / {
    # Try to serve the requested file, otherwise fall back to index.html for SPA routing
    try_files $uri $uri/ /index.html;
  }

  # Optional: You can add a location block for your API to proxy requests
  # to the backend container. This avoids CORS issues in production.
  # location /api/ {
  #   proxy_pass http://backend:8000/; # 'backend' is the service name in docker-compose
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  # }
}
